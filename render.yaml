services:
  - type: web
    name: runwise
    runtime: python
    plan: free
    region: virginia
    buildCommand: pip install -r backend/requirements.txt && npm --prefix frontend ci && npm --prefix frontend run build
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.12
      - key: NODE_VERSION
        value: 24.14.1
      - key: RUNWISE_MODE
        value: personal
      - key: RUNWISE_SERVE_FRONTEND
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: RUNWISE_OWNER_GOOGLE_EMAILS
        sync: false
      - key: RUNWISE_FRONTEND_URL
        sync: false
      - key: RUNWISE_CORS_ORIGINS
        sync: false
      - key: RUNWISE_PUBLIC_BASE_URL
        sync: false
      - key: RUNWISE_TOKEN_ENCRYPTION_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: RUNWISE_GOOGLE_REDIRECT_URI
        sync: false
